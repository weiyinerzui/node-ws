<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>靜夜思 - 李白</title>
    <style>
        body {
            font-family: 'KaiTi', 'STKaiti', 'Serif';
            background-color: #f4f4f4;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-image: url('https://images.unsplash.com/photo-1532372576322-3818d1a4a515?q=80&w=1974&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D');
            background-size: cover;
            background-position: center;
        }
        .container {
            background-color: rgba(255, 255, 255, 0.8);
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            text-align: center;
        }
        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            color: #5a4a42;
        }
        h2 {
            font-size: 1.5em;
            margin-bottom: 30px;
            color: #777;
        }
        p {
            font-size: 1.8em;
            line-height: 1.8;
            margin: 0;
            white-space: pre-wrap; /* 保留換行和空格 */
        }
        .poem {
            color: #4a4a4a;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>靜夜思</h1>
        <h2>李白 (唐)</h2>
        <div class="poem">
            <p>床前明月光，</p>
            <p>疑是地上霜。</p>
            <p>舉頭望明月，</p>
            <p>低頭思故鄉。</p>
        </div>
    </div>

</body>
</html>
